[package]
name = "plugin_api"
version = "0.1.0"
edition = "2021"
description = "Common traits and types for MedusaRust payment provider plugins"
license = "MIT"

[dependencies]
async-trait = "0.1"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
anyhow      = "1.0"
chrono      = { version = "0.4", features = ["serde"] }
reqwest     = { version = "0.12", features = ["json"] }
