# ── MedusaRust — Local development stack ──────────────────────────────────────
#
# Services:
#   postgres  — PostgreSQL 16 (migrations run automatically on server startup)
#   minio     — S3-compatible object storage (MinIO RELEASE.2024+)
#   mc        — MinIO client: creates the bucket + sets it to public-read
#   app       — MedusaRust API server (build from source)
#   admin_ui  — Admin panel (Next.js + Tailwind) served on port 7001
#
# Quick start:
#   docker compose up -d
#   # API available at        http://localhost:9000
#   # Admin panel at          http://localhost:7001
#   # MinIO console at        http://localhost:9001  (admin / minioadmin)

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       medusa_rust
      POSTGRES_USER:     medusa
      POSTGRES_PASSWORD: medusa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa_rust"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"   # S3 API  (mapped to 9002 to avoid clash with the app)
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── MinIO bucket bootstrap ───────────────────────────────────────────────────
  # Runs once after MinIO is healthy, creates the bucket and sets it to public.
  mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/medusa-uploads &&
        mc anonymous set public local/medusa-uploads &&
        echo 'Bucket medusa-uploads is ready (public-read).'
      "

  # ── MedusaRust API server ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "9000:9000"   # Axum HTTP server
    environment:
      DATABASE_URL:         postgres://medusa:medusa@postgres:5432/medusa_rust
      JWT_SECRET:           change-me-in-production-use-a-long-random-string
      HOST:                 0.0.0.0
      PORT:                 9000
      # ── Object storage ────────────────────────────────────────────────────
      # Point to the MinIO container. Change to empty string for native AWS S3.
      S3_ENDPOINT:          http://minio:9000
      S3_BUCKET:            medusa-uploads
      S3_REGION:            us-east-1
      S3_ACCESS_KEY:        minioadmin
      S3_SECRET_KEY:        minioadmin
      S3_FORCE_PATH_STYLE:  "true"
      # Public URL used in asset URLs returned by the API.
      # In production replace with your CDN or nginx proxy in front of MinIO.
      S3_PUBLIC_URL:        http://localhost:9002/medusa-uploads
      # ── Cache ─────────────────────────────────────────────────────────────
      MOKA_MAX_CAPACITY:    10000
      MOKA_TTL_SECS:        300
    volumes:
      - ./migrations:/app/migrations:ro  # migrations are read at runtime

  # ── Admin UI (Next.js) ────────────────────────────────────────────────────
  # Builds the Next.js admin panel from frontend/admin/ and serves it on
  # port 7001. In production you can replace this with a static export
  # behind nginx or serve the .next/ output directly.
  admin_ui:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "7001:7001"   # Admin panel
    environment:
      # Public-facing API URL shown in the browser UI.
      # Change to your public domain in production.
      NEXT_PUBLIC_API_URL: http://localhost:9000
      # Internal URL used by the Next.js server to proxy /api/* requests
      # within the Docker network (not exposed to the browser).
      INTERNAL_API_URL: http://app:9000
      PORT: 7001

volumes:
  pgdata:
  minio_data:
